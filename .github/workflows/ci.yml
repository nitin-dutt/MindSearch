name: CI

# Runs on every push to the main branches and on every pull request.
#   lint          ruff: syntax errors and unused/undefined names
#   test          the full pytest suite against real Neo4j and Qdrant service containers, with a coverage report
#   docker-build  both images build, and the API image can import its libraries
#   audit         pip-audit over the pinned dependency lock (informational: it never fails the build)

on:
  push:
    branches: [main, MSv2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TORCH_VERSION: "2.14.0"
  SPACY_MODEL_URL: https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.0
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Real databases, so the access-control tests run against Neo4j and Qdrant instead of being skipped.
      neo4j:
        image: neo4j:2026.07.1
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 30s
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 10s
    env:
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_PASSWORD: ci-only-password
      QDRANT_URL: http://localhost:6333
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - name: Install dependencies (CPU-only torch, pinned versions)
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -c backend/constraints.txt pytest pytest-cov
          pip install "${SPACY_MODEL_URL}"
      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('backend/settings.py') }}
      - name: Run the test suite with coverage
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider --cov=. --cov-config=.coveragerc --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          NEO4J_PASSWORD=x MINDSEARCH_JWT_SECRET=x MINDSEARCH_DATA_KEY=x docker compose config -q
      - name: Build the API/worker image
        run: docker build ./backend -t mindsearch-api:ci
      - name: Build the frontend image
        run: docker build ./frontend -t mindsearch-frontend:ci
      - name: Smoke-test the API image
        run: docker run --rm mindsearch-api:ci python -c "import fastapi, qdrant_client, sentence_transformers, spacy, neo4j, celery; print('imports ok')"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true      # informational: some advisories have no fixed release yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: Audit the pinned dependency lock
        run: pip-audit -r backend/constraints.txt --no-deps --disable-pip
