# Keeps the pinned versions fresh: Dependabot opens pull requests for updates, and CI (ci.yml) tests them before merging.
# Note: backend/constraints.txt (the full lock) is regenerated by hand from a verified container (command in its header);
# a Dependabot bump of requirements.txt that conflicts with the lock fails CI, which is the signal to refresh the lock.
#
# Grouping: minor and patch updates for each ecosystem arrive together as ONE pull request per week.
# Major updates (which can break things) are left out of the groups, so each still gets its own pull request
# and can be reviewed and tested on its own. The Python base image is also always on its own (see /backend docker).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-docker-minor-patch:
        update-types: [minor, patch]
        # Docker tags look like versions, so python 3.12 -> 3.15 counts as "minor". A Python version change
        # can break libraries (torch etc.), so it is kept out of the group and always gets its own pull request.
        exclude-patterns: [python]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
