# Keeps the pinned versions fresh: Dependabot opens a pull request for each update, and CI (ci.yml) tests it before merging.
# Note: backend/constraints.txt (the full lock) is regenerated by hand from a verified container (command in its header);
# a Dependabot bump of requirements.txt that conflicts with the lock fails CI, which is the signal to refresh the lock.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
