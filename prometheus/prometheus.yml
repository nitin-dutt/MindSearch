global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'worker'          # ingestion metrics (documents, chunks, graph extraction failures)
    static_configs:
      - targets: ['celery_worker:9100']

  - job_name: 'vllm'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['vllm_engine:8000']
