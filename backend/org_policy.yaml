# The active access policy. Replace this file (or set ORG_POLICY_PATH) to match your organization.
# Ready-made examples for other structures are in org_policies/.
organization: MindSearch default
levels:                 # ordered clearance ladder; a higher rank can read everything below it
  - {name: Employee, rank: 1}
  - {name: Manager,  rank: 2}
  - {name: Admin,    rank: 3}   # documents only administrators can read (the Admin ROLE below bypasses every check; this LEVEL lets a document be marked admin-only)
groups: []              # no departments in the default setup
super_roles: [Admin]    # bypass every check (should be audited)
