# Secrets come from .env (see .env.example). Infrastructure ports are bound to localhost only.
# All image versions are pinned (the exact ones the stack was verified with). A healthcheck tells compose when a service is
# really ready, and depends_on waits for it. Memory limits stop one service from starving the rest of the machine.
services:
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512m

  neo4j:
    image: neo4j:2026.07.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 4g

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the qdrant image has no curl or wget; bash can open a TCP connection by itself
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 2g

  vllm_engine:
    image: vllm/vllm-openai:v0.29.0
    ports:
      - "127.0.0.1:8001:8000"
    ipc: host
    environment:
      - VLLM_USE_V2_MODEL_RUNNER=0
      # Use only the model already in the cache, never huggingface.co. Without this, vLLM's first chat request looked up the model's
      # files online and, with the connection failing, retried for ~33 s (found 2026-11-19; a hidden outbound call, ENG-06).
      # First-ever start on a new machine: HF_HUB_OFFLINE=0 once, so the model is downloaded; a missing model then fails loudly.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      # GPU code vLLM compiles (torch.compile, Triton kernels) survives container re-creation; without these the first question after
      # a re-created vLLM took 37 s instead of about 2 s (measured 2026-11-19)
      - vllm_compile_cache:/root/.cache/vllm
      - vllm_triton_cache:/root/.triton
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Default since 2026-11-19 (alignment_plan MODEL-01 / PERF-03, all guards passed): Qwen3.5-4B, 4-bit (Red Hat build), text part
    # only, thinking parsed out, CUDA graphs, at most 12 answers in progress. Each line stays a switch:
    #   VLLM_MODEL / GENERATOR_MODEL     the model (VLLM_MODEL overrides only the server, e.g. for the evaluation judge)
    #   VLLM_QUANTIZATION                must match the model's 4-bit format (awq for Qwen2.5 / the Llama judge)
    #   VLLM_KV_CACHE_DTYPE              PERF-02: auto (16-bit); fp8 was measured and rejected (garbled answers)
    #   VLLM_MAX_NUM_SEQS                cap on answers in progress; CUDA graphs on a hybrid model need <= 47 (12 measured best)
    #   VLLM_REASONING_FLAG              empty = no reasoning parser (a model that does not think)
    #   VLLM_LANGUAGE_MODEL_ONLY_FLAG    empty = load the whole model; with it on, vLLM skips the image part (otherwise no KV room on 8 GB)
    #   VLLM_ENFORCE_EAGER=1             back to eager mode (no CUDA graphs)
    #   VLLM_MTP_TOKENS=N                multi-token prediction; does not fit together with CUDA graphs on 8 GB
    #   VLLM_GPU_MEMORY_UTILIZATION      vLLM's share of the GPU; about 0.86 is the ceiling on this laptop (Windows keeps ~1.1 GiB)
    # Ready-made sets: models/qwen25-7b.env (the previous stack) and models/judge-llama31-8b.env (the evaluation judge), used as
    #   docker compose --env-file .env --env-file models/qwen25-7b.env up -d
    # A value vLLM does not accept stops its start-up: the health check fails and the API never starts (loud, no fallback).
    command: >
      --model ${VLLM_MODEL:-${GENERATOR_MODEL:-RedHatAI/Qwen3.5-4B-quantized.w4a16}}
      --quantization ${VLLM_QUANTIZATION:-compressed-tensors}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --max-model-len ${VLLM_MAX_LEN:-8192}
      --kv-cache-dtype ${VLLM_KV_CACHE_DTYPE:-auto}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-12}
      ${VLLM_REASONING_FLAG---reasoning-parser=qwen3}
      ${VLLM_LANGUAGE_MODEL_ONLY_FLAG---language-model-only}
      --enable-auto-tool-choice
      --tool-call-parser ${VLLM_TOOL_PARSER:-qwen3_coder}
      ${VLLM_ENFORCE_EAGER:+--enforce-eager}
      ${VLLM_MTP_TOKENS:+--speculative-config.method mtp --speculative-config.num_speculative_tokens ${VLLM_MTP_TOKENS}}
    # Healthy = can generate: the check asks the served model for one token. The first generation of a new vLLM process takes about
    # 33 s (measured 2026-11-19; later ones 0.07 s), so it happens here, before the API (which waits for healthy) lets users in.
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, urllib.request as u; m = json.load(u.urlopen('http://localhost:8000/v1/models', timeout=5))['data'][0]['id']; u.urlopen(u.Request('http://localhost:8000/v1/chat/completions', data=json.dumps({'model': m, 'messages': [{'role': 'user', 'content': 'Hi'}], 'max_tokens': 1}).encode(), headers={'Content-Type': 'application/json'}), timeout=80)"]
      interval: 30s
      timeout: 90s
      retries: 10
      start_period: 300s     # loading the model and the first generation take a few minutes

  api:
    build:
      context: ./backend
      args:
        WITH_ONNX: "${WITH_ONNX:-0}"   # 1 = also install onnxruntime, for RERANKER_BACKEND=onnx (PERF-03, measured, not adopted)
        TORCH_CUDA: "${TORCH_CUDA:-1}" # CUDA PyTorch for the GPU re-ranker (PERF-03; image about 12 GB). 0 = CPU-only image
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - MINDSEARCH_JWT_SECRET=${MINDSEARCH_JWT_SECRET:?Set MINDSEARCH_JWT_SECRET in .env}
      - QDRANT_URL=http://qdrant:6333
      - RETRIEVAL_WORKERS=${RETRIEVAL_WORKERS:-4}
      - PIPELINE_PRESET=${PIPELINE_PRESET:-hybrid_graph_chunks}
      - RERANK_ONCE=${RERANK_ONCE:-1}            # 0 = score the pool twice, as before PERF-01 (only for the before/after load test)
      # PERF-03: the cross-encoder runs on the GPU (default since 2026-11-19; vLLM starts first, see depends_on). It scores one batch at
      # start-up (warm-up); if the GPU cannot, the API refuses to start (no fallback). RERANKER_DEVICE=cpu brings the CPU back.
      - RERANKER_BACKEND=${RERANKER_BACKEND:-torch}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-cuda}
      # rewrite (default): one search with a rewritten follow-up. agent: the model plans 1-3 searches by calling a tool (backend/agent.py)
      - CHAT_STRATEGY=${CHAT_STRATEGY:-rewrite}
      - MODEL_MAX_LEN=${VLLM_MAX_LEN:-8192}      # same value vLLM is started with: the prompt budget is computed from it
      - GENERATOR_MODEL=${GENERATOR_MODEL:-RedHatAI/Qwen3.5-4B-quantized.w4a16}   # the model vLLM serves (see vllm_engine)
      - GENERATOR_THINKING=${GENERATOR_THINKING:-off}   # off | on (answers think, helper calls never) | none (a model without the option)
      - PROMPT_PROFILE=${PROMPT_PROFILE:-enterprise_q35c}   # the prompt tuned for Qwen3.5 on dev sets; enterprise for Qwen2.5
      - TOKENIZERS_PARALLELISM=false
      - MINDSEARCH_DATA_KEY=${MINDSEARCH_DATA_KEY:?Set MINDSEARCH_DATA_KEY in .env}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm_engine:8000/v1
    volumes:
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
      - ./backend/logs:/app/logs
      # Users and the org policy are config, not code. create_host_path: false makes compose fail loudly
      # (instead of silently creating an empty directory) if users.yaml has not been created yet:
      #   python backend/manage_users.py add <name> --level <Level>
      - type: bind
        source: ./backend/users.yaml
        target: /app/users.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./backend/org_policy.yaml:/app/org_policy.yaml:ro
      # GPU code compiled on first use (about 130 MB) survives container re-creation: first question 7.7 s -> 1.3 s (measured)
      - reranker_cuda_cache:/root/.nv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 90s     # loads the embedding and reranker models
    mem_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      vllm_engine:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      args:
        WITH_EVAL: "1"      # the worker image also carries the evaluation libraries (RAGAS); the API image does not
        WITH_ONNX: "${WITH_ONNX:-0}"
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - MINDSEARCH_DATA_KEY=${MINDSEARCH_DATA_KEY:?Set MINDSEARCH_DATA_KEY in .env}
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm_engine:8000/v1
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Graph extraction backend: ollama (14B on CPU, best accuracy, slow) or vllm (GPU, fast). See kg_extractors.py
      - KG_EXTRACTOR=${KG_EXTRACTOR:-ollama}
      - MODEL_MAX_LEN=${VLLM_MAX_LEN:-8192}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-RedHatAI/Qwen3.5-4B-quantized.w4a16}   # the model vLLM serves (see vllm_engine)
      - GENERATOR_THINKING=${GENERATOR_THINKING:-off}
      - PROMPT_PROFILE=${PROMPT_PROFILE:-enterprise_q35c}
      - RERANKER_BACKEND=${RERANKER_BACKEND:-torch}   # same re-ranker model as the API, so evaluation runs measure what users get
      - RERANKER_DEVICE=${WORKER_RERANKER_DEVICE:-cpu}   # the worker has no GPU; GPU and CPU scores were identical on 100/100 pools
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/org_policy.yaml:/app/org_policy.yaml:ro
      - huggingface_cache:/root/.cache/huggingface
      # Evaluation harness: results and datasets live on the host so they survive the container
      - ./backend/evaluation:/app/evaluation
      - ./backend/eval_data:/app/eval_data
      - ./backend/qdrant_eval:/app/qdrant_eval
    mem_limit: 6g          # the worker also runs the evaluation harness (embedder, reranker, RAGAS)
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The React UI (web/): nginx serves the built app and forwards /api to the API, so the browser talks to one address.
  # Bound to this machine only; to show it on another device use a temporary HTTPS tunnel to this one port (see README).
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    mem_limit: 1g

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning: the Prometheus data source and the MindSearch dashboard load by themselves (no clicking). Regenerate the
      # dashboard with: python grafana/build_dashboard.py
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}      # localhost-only; set GRAFANA_ADMIN_PASSWORD in .env to change it
    mem_limit: 512m
    depends_on:
      - prometheus

volumes:
  vllm_compile_cache:
  vllm_triton_cache:
  reranker_cuda_cache:
  redis_data:
  neo4j_data:
  huggingface_cache:
  qdrant_storage:
  prometheus_data:
  grafana_data:
