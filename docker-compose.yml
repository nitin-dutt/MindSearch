# Secrets come from .env (see .env.example). Infrastructure ports are bound to localhost only.
# All image versions are pinned (the exact ones the stack was verified with). A healthcheck tells compose when a service is
# really ready, and depends_on waits for it. Memory limits stop one service from starving the rest of the machine.
services:
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512m

  neo4j:
    image: neo4j:2026.07.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 4g

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the qdrant image has no curl or wget; bash can open a TCP connection by itself
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 2g

  vllm_engine:
    image: vllm/vllm-openai:v0.29.0
    ports:
      - "127.0.0.1:8001:8000"
    ipc: host
    environment:
      - VLLM_USE_V2_MODEL_RUNNER=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # VLLM_MODEL lets the evaluation swap in a different judge model (see evaluation/judge.py);
    # unset, it serves the Qwen generator exactly as before.
    command: >
      --model ${VLLM_MODEL:-${GENERATOR_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}}
      --quantization awq
      --gpu-memory-utilization 0.85 
      --max-model-len ${VLLM_MAX_LEN:-8192}
      --enforce-eager
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 240s     # loading the model takes a few minutes

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - MINDSEARCH_JWT_SECRET=${MINDSEARCH_JWT_SECRET:?Set MINDSEARCH_JWT_SECRET in .env}
      - QDRANT_URL=http://qdrant:6333
      - RETRIEVAL_WORKERS=${RETRIEVAL_WORKERS:-4}
      - PIPELINE_PRESET=${PIPELINE_PRESET:-full_hybrid}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}   # the model vLLM serves (see vllm_engine); one setting for both
      - TOKENIZERS_PARALLELISM=false
      - MINDSEARCH_DATA_KEY=${MINDSEARCH_DATA_KEY:?Set MINDSEARCH_DATA_KEY in .env}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm_engine:8000/v1
    volumes:
      - ./backend/uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
      - ./backend/logs:/app/logs
      # Users and the org policy are config, not code. create_host_path: false makes compose fail loudly
      # (instead of silently creating an empty directory) if users.yaml has not been created yet:
      #   python backend/manage_users.py add <name> --level <Level>
      - type: bind
        source: ./backend/users.yaml
        target: /app/users.yaml
        read_only: true
        bind:
          create_host_path: false
      - ./backend/org_policy.yaml:/app/org_policy.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 90s     # loads the embedding and reranker models
    mem_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      vllm_engine:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      args:
        WITH_EVAL: "1"      # the worker image also carries the evaluation libraries (RAGAS); the API image does not
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - MINDSEARCH_DATA_KEY=${MINDSEARCH_DATA_KEY:?Set MINDSEARCH_DATA_KEY in .env}
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VLLM_API_BASE=http://vllm_engine:8000/v1
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Graph extraction backend: ollama (14B on CPU, best accuracy, slow) or vllm (GPU, fast). See kg_extractors.py
      - KG_EXTRACTOR=${KG_EXTRACTOR:-ollama}
      - GENERATOR_MODEL=${GENERATOR_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/org_policy.yaml:/app/org_policy.yaml:ro
      - huggingface_cache:/root/.cache/huggingface
      # Evaluation harness: results and datasets live on the host so they survive the container
      - ./backend/evaluation:/app/evaluation
      - ./backend/eval_data:/app/eval_data
      - ./backend/qdrant_eval:/app/qdrant_eval
    mem_limit: 6g          # the worker also runs the evaluation harness (embedder, reranker, RAGAS)
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    mem_limit: 1g

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 512m
    depends_on:
      - prometheus

volumes:
  redis_data:
  neo4j_data:
  huggingface_cache:
  qdrant_storage:
  prometheus_data:
  grafana_data:
